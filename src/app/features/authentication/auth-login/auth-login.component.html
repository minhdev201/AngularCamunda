<div class="auth-main">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="auth-header">
        <a href="javascript:">
          <img alt="logo" src="assets/images/logo-dark.svg">
        </a>
      </div>

      <div class="card my-5">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h3 class="mb-0"><b>Login</b></h3>
            <a [routerLink]="['/register']" class="link-primary">Don't have an account?</a>
          </div>

          <!-- Username input -->
          <div class="form-group mb-3">
            <label class="form-label" for="email">Email Address</label>
            <input class="form-control" id="email" type="email" [(ngModel)]="username" placeholder="Email Address" />
          </div>

          <!-- Password input -->
          <div class="form-group mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" type="password" [(ngModel)]="password" placeholder="Password" />
          </div>

          <div class="d-flex justify-content-between mt-1">
            <!-- Keep me signed in checkbox -->
            <div class="form-check">
              <input class="form-check-input input-primary" id="customCheckc1" type="checkbox" checked />
              <label class="text-muted form-check-label" for="customCheckc1">Keep me signed in</label>
            </div>
            <h5 class="f-w-400 text-secondary">
              <a href="javascript:">Forgot Password?</a>
            </h5>
          </div>

          <!-- Submit button -->
          <div class="d-grid mt-4">
            <button class="btn btn-primary" (click)="onLogin()">Login</button>
          </div>

          <!-- Login with social options -->
          <div class="mt-3 separator">
            <span>Login with</span>
          </div>
          <div class="row">
            <div class="col-4" *ngFor="let item of SignInOptions">
              <div class="d-grid">
                <button class="btn bg-light btn-light-primary mt-2 text-muted" type="button">
                  <img alt="google img" src="{{ item.image }}" />
                  <span class="d-none d-sm-inline-block">{{ item.name }}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer links -->
      <div class="row auth-footer">
        <div class="my-1 col">
          <p class="m-0">Copyright © <a href="https://codedthemes.com/" target="_blank">CodedThemes</a></p>
        </div>
        <div class="my-1 col-auto">
          <ul class="mb-0 footer-link list-inline">
            <li class="list-inline-item"><a href="https://codedthemes.com/" target="_blank">Home</a></li>
            <li class="list-inline-item"><a href="https://codedthemes.com/privacy-policy/" target="_blank">Privacy
                Policy</a></li>
            <li class="list-inline-item"><a href="https://codedthemes.support-hub.io/" target="_blank">Contact us</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
